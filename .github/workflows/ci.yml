name: Sprawdz projekt
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Zbuduj pakiet
        run: npm run build
      - name: Testy
        run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: ha-custom-cards
          path: dist/ha-custom-cards.js
          if-no-files-found: error
