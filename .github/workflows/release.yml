name: Opublikuj wersje
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Wersja bez v, np. 1.0.0 lub 1.0.1'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: ha-custom-cards-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ustaw i sprawdz wersje
        run: |
          node scripts/set-version.mjs
          if git rev-parse -q --verify "refs/tags/v${RELEASE_VERSION}"; then
            echo "Ten tag juz istnieje. Podaj nowy numer wersji."
            exit 1
          fi
      - name: Zbuduj i przetestuj
        run: |
          npm run build
          npm test
      - name: Zapisz pakiet i tag
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json dist/ha-custom-cards.js
          if ! git diff --cached --quiet; then
            git commit -m "Release v${RELEASE_VERSION}"
          fi
          git tag "v${RELEASE_VERSION}"
          git push --atomic origin "HEAD:${GITHUB_REF_NAME}" "refs/tags/v${RELEASE_VERSION}"
      - name: Utworz GitHub Release z plikiem dla HACS
        run: >-
          gh release create "v${RELEASE_VERSION}"
          dist/ha-custom-cards.js
          --verify-tag
          --title "v${RELEASE_VERSION}"
          --generate-notes
